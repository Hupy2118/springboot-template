    targetId: backend.capability-webmvc
    type: TEXT_ANCHOR_INSERT
    order: 190
    parameters: { anchor: "// xcodeagent:capability-interceptors", position: before, managedMarker: login-interceptor, content: "/* xcodeagent:login-interceptor:begin */\nregistry.addInterceptor(loginCurrentUserInterceptor).order(100).addPathPatterns(\"/**\").excludePathPatterns(\"/api/login/mock\");\n/* xcodeagent:login-interceptor:end */" }
