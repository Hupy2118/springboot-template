    type: TEXT_ANCHOR_INSERT
    order: 290
    parameters: { anchor: "// xcodeagent:capability-interceptors", position: before, managedMarker: authorization-interceptor, content: "/* xcodeagent:authorization-interceptor:begin */\nregistry.addInterceptor(authorizationResourcePermissionInterceptor).order(200).addPathPatterns(\"/**\").excludePathPatterns(\"/api/login/mock\", \"/actuator/**\");\n/* xcodeagent:authorization-interceptor:end */" }
