  - { id: frontend.authorization.import-page-wrapper, targetId: frontend.capability-routes, type: ENSURE_IMPORT, order: 240, parameters: { importStatement: "import { wrapAuthorizationPage } from '@/components/authorization/wrapAuthorizationPage'" } }
