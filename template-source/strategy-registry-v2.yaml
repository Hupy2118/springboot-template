  - id: frontend.authorization.register-menu-transform
    targetId: frontend.capability-menus
    type: TEXT_ANCHOR_INSERT
    order: 270
    parameters: { anchor: "// xcodeagent:capability-menu-transforms", position: before, managedMarker: authorization-menu-transform, content: "/* xcodeagent:authorization-menu-transform:begin */\ncurrent = useAuthorizationMenuTransform(current);\n/* xcodeagent:authorization-menu-transform:end */" }
