    targetId: frontend.capability-routes
    type: TEXT_ANCHOR_INSERT
    order: 250
    parameters: { anchor: "// xcodeagent:capability-page-wrappers", position: before, managedMarker: authorization-page-wrapper, content: "/* xcodeagent:authorization-page-wrapper:begin */\nwrapAuthorizationPage,\n/* xcodeagent:authorization-page-wrapper:end */" }
