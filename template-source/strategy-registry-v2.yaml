  - id: frontend.login.register-provider
    targetId: frontend.capability-providers
    type: TEXT_ANCHOR_INSERT
    order: 110
    parameters: { anchor: "// xcodeagent:capability-providers", position: before, managedMarker: login-provider, content: "/* xcodeagent:login-provider:begin */\nGlobalContextProvider,\n/* xcodeagent:login-provider:end */" }
  - { id: frontend.login.import-login-route, targetId: frontend.capability-routes, type: ENSURE_IMPORT, order: 120, parameters: { importStatement: "import LoginPage from '@/pages/Login'" } }
  - id: frontend.login.register-login-route
    targetId: frontend.capability-routes
    type: TEXT_ANCHOR_INSERT
    order: 130
    parameters: { anchor: "// xcodeagent:capability-root-routes", position: before, managedMarker: login-route, content: "/* xcodeagent:login-route:begin */\n{ path: '/login', element: <LoginPage /> },\n/* xcodeagent:login-route:end */" }
