    parameters: { anchor: "// xcodeagent:capability-interceptor-fields", position: before, managedMarker: login-interceptor-field, content: "/* xcodeagent:login-interceptor-field:begin */\n@org.springframework.beans.factory.annotation.Autowired\nprivate com.cmbchina.backend.auth.common.interceptor.UserWebMvcInterceptor loginCurrentUserInterceptor;\n/* xcodeagent:login-interceptor-field:end */" }
