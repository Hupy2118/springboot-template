    targetId: backend.capability-webmvc
    type: TEXT_ANCHOR_INSERT
    order: 280
    parameters: { anchor: "// xcodeagent:capability-interceptor-fields", position: before, managedMarker: authorization-interceptor-field, content: "/* xcodeagent:authorization-interceptor-field:begin */\n@org.springframework.beans.factory.annotation.Autowired\nprivate com.cmbchina.backend.auth.common.interceptor.ResourcePermissionInterceptor authorizationResourcePermissionInterceptor;\n/* xcodeagent:authorization-interceptor-field:end */" }
  - id: backend.authorization.register-interceptor
