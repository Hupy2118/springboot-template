schemaVersion: 2
targets:
  - { id: frontend.capability-providers, path: frontend/src/capability-extensions/providers.tsx }
  - { id: frontend.capability-routes, path: frontend/src/capability-extensions/routes.tsx }
  - { id: frontend.capability-route-guards, path: frontend/src/capability-extensions/routeGuards.tsx }
  - { id: frontend.capability-menus, path: frontend/src/capability-extensions/menuTransforms.ts }
  - { id: backend.capability-webmvc, path: backend/src/main/java/com/cmbchina/backend/common/config/CapabilityWebMvcConfiguration.java }
anchors:
  - { targetId: frontend.capability-providers, anchorKey: capability-providers, anchor: "// xcodeagent:capability-providers", position: before }
  - { targetId: frontend.capability-routes, anchorKey: capability-root-routes, anchor: "// xcodeagent:capability-root-routes", position: before }
  - { targetId: frontend.capability-routes, anchorKey: capability-page-routes, anchor: "// xcodeagent:capability-page-routes", position: before }
  - { targetId: frontend.capability-route-guards, anchorKey: app-route-guards, anchor: "// xcodeagent:app-route-guards", position: before }
  - { targetId: frontend.capability-route-guards, anchorKey: page-route-guards, anchor: "// xcodeagent:page-route-guards", position: before }
  - { targetId: frontend.capability-menus, anchorKey: capability-menu-transforms, anchor: "// xcodeagent:capability-menu-transforms", position: before }
  - { targetId: backend.capability-webmvc, anchorKey: capability-interceptors, anchor: "// xcodeagent:capability-interceptors", position: before }
strategies:
  - { id: frontend.login.import-provider, targetId: frontend.capability-providers, type: ENSURE_IMPORT, order: 100, parameters: { importStatement: "import { GlobalContextProvider } from '@/providers'" } }
  - id: frontend.login.register-provider
    targetId: frontend.capability-providers
    type: TEXT_ANCHOR_INSERT
    order: 110
    parameters: { anchor: "// xcodeagent:capability-providers", position: before, managedMarker: login-provider, content: "/* xcodeagent:login-provider:begin */\nGlobalContextProvider,\n/* xcodeagent:login-provider:end */\n" }
  - { id: frontend.login.import-login-route, targetId: frontend.capability-routes, type: ENSURE_IMPORT, order: 120, parameters: { importStatement: "import LoginPage from '@/pages/Login'" } }
  - id: frontend.login.register-login-route
    targetId: frontend.capability-routes
    type: TEXT_ANCHOR_INSERT
    order: 130
    parameters: { anchor: "// xcodeagent:capability-root-routes", position: before, managedMarker: login-route, content: "/* xcodeagent:login-route:begin */\n{ path: '/login', element: <LoginPage /> },\n/* xcodeagent:login-route:end */\n" }
  - { id: frontend.login.import-logout-route, targetId: frontend.capability-routes, type: ENSURE_IMPORT, order: 140, parameters: { importStatement: "import LogoutPage from '@/pages/Logout'" } }
  - id: frontend.login.register-logout-route
    targetId: frontend.capability-routes
    type: TEXT_ANCHOR_INSERT
    order: 150
    parameters: { anchor: "// xcodeagent:capability-root-routes", position: before, managedMarker: logout-route, content: "/* xcodeagent:logout-route:begin */\n{ path: '/logout', element: <LogoutPage /> },\n/* xcodeagent:logout-route:end */\n" }
  - { id: frontend.login.import-app-route-guard, targetId: frontend.capability-route-guards, type: ENSURE_IMPORT, order: 160, parameters: { importStatement: "import { createLoginRouteGuard } from '@/components/loginRouteGuard'" } }
  - id: frontend.login.register-app-route-guard
    targetId: frontend.capability-route-guards
    type: TEXT_ANCHOR_INSERT
    order: 170
    parameters: { anchor: "// xcodeagent:app-route-guards", position: before, managedMarker: login-app-route-guard, content: "/* xcodeagent:login-app-route-guard:begin */\ncreateLoginRouteGuard,\n/* xcodeagent:login-app-route-guard:end */\n" }
  - id: backend.login.register-interceptor
    targetId: backend.capability-webmvc
    type: TEXT_ANCHOR_INSERT
    order: 190
    parameters: { anchor: "// xcodeagent:capability-interceptors", position: before, managedMarker: login-interceptor, content: "/* xcodeagent:login-interceptor:begin */\nregistry.addInterceptor(applicationContext.getBean(\n        com.cmbchina.backend.auth.common.interceptor.UserWebMvcInterceptor.class))\n    .order(100)\n    .addPathPatterns(\"/**\")\n    .excludePathPatterns(\"/api/login/mock\");\n/* xcodeagent:login-interceptor:end */\n" }
  - { id: frontend.authorization.import-provider, targetId: frontend.capability-providers, type: ENSURE_IMPORT, order: 200, parameters: { importStatement: "import { AuthProvider } from '@/providers/AuthProvider'" } }
  - id: frontend.authorization.register-provider
    targetId: frontend.capability-providers
    type: TEXT_ANCHOR_INSERT
    order: 210
    parameters: { anchor: "// xcodeagent:capability-providers", position: before, managedMarker: authorization-provider, content: "/* xcodeagent:authorization-provider:begin */\nAuthProvider,\n/* xcodeagent:authorization-provider:end */\n" }
  - id: frontend.authorization.register-page-route
    targetId: frontend.capability-routes
    type: TEXT_ANCHOR_INSERT
    order: 230
    parameters: { anchor: "// xcodeagent:capability-page-routes", position: before, managedMarker: authorization-page-route, content: "/* xcodeagent:authorization-page-route:begin */\n{ name: '权限管理', pageId: 'authorization_management', resourceKey: 'system_authorization_management' },\n/* xcodeagent:authorization-page-route:end */\n" }
  - { id: frontend.authorization.import-page-route-guard, targetId: frontend.capability-route-guards, type: ENSURE_IMPORT, order: 240, parameters: { importStatement: "import { createAuthorizationRouteGuard } from '@/components/authorization/createAuthorizationRouteGuard'" } }
  - id: frontend.authorization.register-page-route-guard
    targetId: frontend.capability-route-guards
    type: TEXT_ANCHOR_INSERT
    order: 250
    parameters: { anchor: "// xcodeagent:page-route-guards", position: before, managedMarker: authorization-page-route-guard, content: "/* xcodeagent:authorization-page-route-guard:begin */\ncreateAuthorizationRouteGuard,\n/* xcodeagent:authorization-page-route-guard:end */\n" }
  - { id: frontend.authorization.import-menu-transform, targetId: frontend.capability-menus, type: ENSURE_IMPORT, order: 260, parameters: { importStatement: "import { useAuthorizationMenuTransform } from '@/hooks/useAuthorizationMenuTransform'" } }
  - id: frontend.authorization.register-menu-transform
    targetId: frontend.capability-menus
    type: TEXT_ANCHOR_INSERT
    order: 270
    parameters: { anchor: "// xcodeagent:capability-menu-transforms", position: before, managedMarker: authorization-menu-transform, content: "/* xcodeagent:authorization-menu-transform:begin */\ncurrent = useAuthorizationMenuTransform(current);\n/* xcodeagent:authorization-menu-transform:end */\n" }
  - id: backend.authorization.register-interceptor
    targetId: backend.capability-webmvc
    type: TEXT_ANCHOR_INSERT
    order: 290
    parameters: { anchor: "// xcodeagent:capability-interceptors", position: before, managedMarker: authorization-interceptor, content: "/* xcodeagent:authorization-interceptor:begin */\nregistry.addInterceptor(applicationContext.getBean(\n        com.cmbchina.backend.auth.common.interceptor.ResourcePermissionInterceptor.class))\n    .order(200)\n    .addPathPatterns(\"/**\")\n    .excludePathPatterns(\"/api/login/mock\", \"/actuator/**\");\n/* xcodeagent:authorization-interceptor:end */\n" }
validators:
  - id: login.postcondition
    order: 10
    parameters:
      type: CAPABILITY_POSTCONDITION
      executionMode: REAL_WORKSPACE
      blocking: true
      timeoutSeconds: 30
      workingDirectory: .
      capabilityId: login
      checks:
        - { type: FILE_EXISTS, path: frontend/src/pages/Login/index.tsx }
        - { type: STRUCTURE_CHECK, path: frontend/src/capability-extensions/providers.tsx, containsAll: ["xcodeagent:login-provider:begin"] }
        - { type: STRUCTURE_CHECK, path: frontend/src/capability-extensions/routeGuards.tsx, containsAll: ["xcodeagent:login-app-route-guard:begin"] }
        - { type: STRUCTURE_CHECK, path: backend/src/main/java/com/cmbchina/backend/common/config/CapabilityWebMvcConfiguration.java, containsAll: ["xcodeagent:login-interceptor:begin"] }
  - id: authorization.postcondition
    order: 20
    parameters:
      type: CAPABILITY_POSTCONDITION
      executionMode: REAL_WORKSPACE
      blocking: true
      timeoutSeconds: 30
      workingDirectory: .
      capabilityId: authorization
      checks:
        - { type: FILE_EXISTS, path: frontend/src/pages/AuthorizationManagement/index.tsx }
        - { type: STRUCTURE_CHECK, path: frontend/src/capability-extensions/providers.tsx, containsAll: ["xcodeagent:authorization-provider:begin"] }
        - { type: STRUCTURE_CHECK, path: frontend/src/capability-extensions/routeGuards.tsx, containsAll: ["xcodeagent:authorization-page-route-guard:begin"] }
        - { type: STRUCTURE_CHECK, path: backend/src/main/java/com/cmbchina/backend/common/config/CapabilityWebMvcConfiguration.java, containsAll: ["xcodeagent:authorization-interceptor:begin"] }
  - id: frontend.build
    order: 100
    parameters: { type: NPM_BUILD, executionMode: SANDBOX, blocking: true, timeoutSeconds: 300, workingDirectory: frontend }
  - id: backend.test
    order: 200
    parameters: { type: MAVEN_TEST, executionMode: SANDBOX, blocking: true, timeoutSeconds: 300, workingDirectory: backend }
