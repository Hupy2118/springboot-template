dependencies: []
extensions:
  - point: frontend.providers
    id: authorization-provider
    order: 200
    payload: { module: '@/providers/AuthProvider', export: AuthProvider, exportType: named, props: {} }
  - point: frontend.page-routes
    id: authorization-management-page
    order: 200
    payload: { path: system/authorization, name: 权限管理, module: '@/pages/System/AuthorizationManagementPage', export: default, exportType: default, resourceKey: system_authorization_management }
  - point: frontend.page-wrappers
    id: authorization-page-guard
    order: 200
    payload: { module: '@/components/authorization/wrapAuthorizationPage', export: wrapAuthorizationPage, exportType: named }
  - point: frontend.menu-hooks
    id: authorization-menu-transform
    order: 200
    payload: { module: '@/hooks/useAuthorizationMenuTransform', export: useAuthorizationMenuTransform, exportType: named }
  - point: backend.spring-interceptors
    id: authorization-resource-permission
    order: 200
    payload: { className: com.cmbchina.backend.auth.common.interceptor.ResourcePermissionInterceptor, order: 200, pathPatterns: ['/**'], excludePathPatterns: ['/api/login/mock', '/actuator/**'] }
migrations:
  - { id: schema, source: migrations/001-schema.sql, target: backend/src/main/resources/xcodeagent/migrations/authorization/001-schema.sql, order: 100, mode: COPY }
  - { id: initialization, source: migrations/002-initialization.sql, target: backend/src/main/resources/xcodeagent/migrations/authorization/002-initialization.sql, order: 200, mode: COPY }
