version: 1
extensionPoints:
  - point: frontend.providers
    payloadSchema: schemas/extensions/frontend-provider.schema.json
    renderer: frontend-provider-renderer
    target: frontend/src/generated/capabilityProviders.tsx
    cardinality: MANY
    orderBy: CONTRIBUTION_ORDER
  - point: frontend.root-routes
    payloadSchema: schemas/extensions/frontend-root-route.schema.json
    renderer: frontend-root-route-renderer
    target: frontend/src/generated/capabilityRoutes.tsx
    cardinality: MANY
    orderBy: CONTRIBUTION_ORDER
  - point: frontend.page-routes
    payloadSchema: schemas/extensions/frontend-page-route.schema.json
    renderer: frontend-page-route-renderer
    target: frontend/src/generated/capabilityRoutes.tsx
    cardinality: MANY
    orderBy: CONTRIBUTION_ORDER
  - point: frontend.page-wrappers
    payloadSchema: schemas/extensions/frontend-page-wrapper.schema.json
    renderer: frontend-page-wrapper-renderer
    target: frontend/src/generated/capabilityRoutes.tsx
    cardinality: MANY
    orderBy: CONTRIBUTION_ORDER
  - point: frontend.menu-hooks
    payloadSchema: schemas/extensions/frontend-menu-transform.schema.json
    renderer: frontend-menu-transform-renderer
    target: frontend/src/generated/capabilityMenus.ts
    cardinality: MANY
    orderBy: CONTRIBUTION_ORDER
  - point: backend.spring-interceptors
    payloadSchema: schemas/extensions/backend-webmvc-interceptor.schema.json
    renderer: backend-webmvc-interceptor-renderer
    target: backend/src/main/java/com/cmbchina/backend/common/config/CapabilityWebMvcConfiguration.java
    cardinality: MANY
    orderBy: CONTRIBUTION_ORDER
