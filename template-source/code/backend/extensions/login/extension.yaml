id: login
requires: []
contributes:
  applicationAnnotations:
  - annotationClass: com.cmb.bee.auth.client.config.EnableAuthClient
  mavenDependencies:
  - groupId: ZA21
    artifactId: bee-starter-auth
  applicationYaml:
    bee:
      auth:
        client-id: ${yht.authentication.client-id}
        private-key: ${yht.authentication.private-key}
        public-key: ${yht.authentication.public-key}
        center-public-key: ${yht.authentication.center-public-key}
        center-uri: ${yht.authentication.center-uri}
        login:
          authorize-uri: ${yht.authentication.authorize-uri}
          redirect-uri: ${yht.authentication.redirect-uri}
          filter-patterns: /*
  applicationProfileYaml:
    dev:
      yht:
        authentication:
          client-id: client-id
          private-key: private-key
          public-key: public-key
          center-public-key: center-public-key
          center-uri: http://one-account-gateway.paasuat.cmbchina.cn/auth-server
          authorize-uri: https://one-account-gateway.paasuat.cmbchina.cn/auth-server/auth
          redirect-uri: http://localhost
