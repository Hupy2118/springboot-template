server:
  port: 8080
bee:
  enableMybatisPlus: true
  persistence:
    ds1:
      mapperscan:
        packages: com.cmbchina
      datasource:
        driver-class-name: com.tencentcloud.tdsql.mysql.cj.jdbc.Driver
        url: jdbc:tdsql-mysql://${datasource.ds1.url}:${datasource.ds1.port}/${datasource.ds1.schema}?passwordCharacterEncoding=latin1&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useUnicode=true&useSSL=false&connectTimeout=10000&socketTimeout=600000&tdsqlSendClientInfoEnable=true
        username: ${datasource.ds1.username}
        password: ${datasource.ds1.password}
        test-on-borrow: true
        test-while-idle: true
        time-between-eviction-runs-millis: 5000
        validation-interval: 3000
        validation-query-timeout: 5
        initial-size: 10
        max-active: 20
        min-idle: 10
        max-idle: 10
        max-wait: 30000
        validation-query: SELECT 1
        test-on-connect: false
        test-on-return: false
        min-evictable-idle-time-millis: 120000
        max-age: 1600000
  tracing:
    businessIds:
      LT5406A001B001C001D001: /api
module:
  httpClient:
    maxTotal: 200
    maxPerRoute: 100
    connectionRequestTimeoutInMilliseconds: 3000
    connectionTimeoutInMilliseconds: 3000
    socketTimeoutInMilliseconds: 30000
