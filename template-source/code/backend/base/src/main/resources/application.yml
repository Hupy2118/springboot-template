server:
  port: 8080

bee:
  enableMybatisPlus: true
  persistence:
    xcode-agent:
      mapperscan:
        packages: com.cmbchina
      #      mybatis:
      #        mapper-locations: classpath:mapper/**/*.xml
      datasource:
        driver-class-name: com.tencentcloud.tdsql.mysql.cj.jdbc.Driver
        url: jdbc:tdsql-mysql://${xcode-agent.db.url}:${xcode-agent.db.port}/${xcode-agent.db.schema}?passwordCharacterEncoding=latin1&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useUnicode=true&useSSL=false&connectTimeout=10000&socketTimeout=600000&tdsqlSendClientInfoEnable=true
        username: ${xcode-agent.db.username}
        password: ${xcode-agent.db.password}
        test-on-borrow: true
        test-while-idle: true
        time-between-eviction-runs-millis: 5000
        validation-interval: 3000
        validation-query-timeout: 5
        initial-size: 10
        max-active: 20
        min-idle: 10
        max-idle: 10
        max-wait: 30000
        validation-query: SELECT 1
        test-on-connect: false
        test-on-return: false
        min-evictable-idle-time-millis: 120000
        max-age: 1600000
  tracing:
    businessIds:
      LT5406A001B001C001D001: /api

module:
  httpClient:
    maxTotal: 200
    maxPerRoute: 100
    connectionRequestTimeoutInMilliseconds: 3000
    connectionTimeoutInMilliseconds: 3000
    socketTimeoutInMilliseconds: 30000

xcode-agent:
  db:
    url: 127.0.0.1
    port: 3306
    schema: xcode
    username: root
    password: