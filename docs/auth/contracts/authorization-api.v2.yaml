openapi: 3.0.3
info:
  title: XCodeAgent Authorization Management API
  version: authorization-api.v2
  description: 基于角色、资源、角色资源和角色成员四表的内置 RBAC 接口；所有接口使用 ResponseEntity，业务结果通过 returnCode 表达。
servers:
  - url: /
paths:
  /api/authorization/mock-login:
    post:
      operationId: mockAuthorizationLogin
      description: 从固定 mock 成员中选择身份，签发 HS256 JWT 并通过 HttpOnly Cookie 返回，仅用于本地联调。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MockLoginRequest' } } } }
      responses:
        '200':
          description: 模拟登录成功
          headers:
            Set-Cookie: { description: 包含 JWT 的 HttpOnly Cookie, schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MemberEnvelope' } } }
  /api/authorization/me/resources:
    get:
      operationId: getMyResources
      responses:
        '200': { description: 当前成员资源点, content: { application/json: { schema: { $ref: '#/components/schemas/MemberResourcesEnvelope' } } } }
  /api/authorization/resources:
    get:
      operationId: listAuthorizationResources
      parameters: [{ $ref: '#/components/parameters/Current' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: 只读资源目录, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceListEnvelope' } } } }
  /api/authorization/resources/{resourceKey}:
    get:
      operationId: getAuthorizationResource
      parameters: [{ $ref: '#/components/parameters/ResourceKey' }]
      responses:
        '200': { description: 资源详情, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionResourceEnvelope' } } } }
  /api/authorization/roles:
    get:
      operationId: listAuthorizationRoles
      parameters: [{ $ref: '#/components/parameters/Current' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: 角色列表, content: { application/json: { schema: { $ref: '#/components/schemas/RoleListEnvelope' } } } }
    post:
      operationId: createAuthorizationRole
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleUpsertRequest' } } } }
      responses:
        '200': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/RoleEnvelope' } } } }
  /api/authorization/roles/{roleId}:
    get:
      operationId: getAuthorizationRole
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      responses:
        '200': { description: 角色详情, content: { application/json: { schema: { $ref: '#/components/schemas/RoleEnvelope' } } } }
    put:
      operationId: updateAuthorizationRole
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleUpsertRequest' } } } }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/RoleEnvelope' } } } }
    delete:
      operationId: deleteAuthorizationRole
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyEnvelope' } } } }
  /api/authorization/roles/{roleId}/status:
    put:
      operationId: setAuthorizationRoleStatus
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleStatusRequest' } } } }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/RoleEnvelope' } } } }
  /api/authorization/roles/{roleId}/resources:
    get:
      operationId: getAuthorizationRoleResources
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      responses:
        '200': { description: 角色资源, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResourcesEnvelope' } } } }
    put:
      operationId: setAuthorizationRoleResources
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: array, uniqueItems: true, items: { type: string } } } } }
      responses:
        '200': { description: 已添加, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResourcesEnvelope' } } } }
  /api/authorization/roles/{roleId}/members:
    get:
      operationId: getAuthorizationRoleMembers
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      responses:
        '200': { description: 角色成员, content: { application/json: { schema: { $ref: '#/components/schemas/RoleMembersEnvelope' } } } }
    put:
      operationId: bindAuthorizationRoleMembers
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Member' } } } } }
      responses:
        '200': { description: 已绑定, content: { application/json: { schema: { $ref: '#/components/schemas/RoleMembersEnvelope' } } } }
  /api/authorization/members:
    get:
      operationId: listAuthorizationMembers
      description: 当前返回固定 mock 成员数据，仅用于列表联调。
      parameters: [{ $ref: '#/components/parameters/Current' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: 成员列表, content: { application/json: { schema: { $ref: '#/components/schemas/MemberListEnvelope' } } } }
components:
  parameters:
    ResourceKey: { name: resourceKey, in: path, required: true, schema: { type: string } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: string, maxLength: 32 } }
    Current: { name: current, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    NotFound: { description: 不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ValidationFailed: { description: 请求校验失败, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 业务冲突, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            returnCode: { type: string, pattern: '^XCD1B[0-9]{2}$', example: XCD1B01 }
            errorMsg: { type: string, example: 权限资源不存在 }
            body: { type: object, nullable: true }
    ResponseEnvelope:
      type: object
      required: [returnCode]
      properties:
        returnCode: { type: string, example: SUC0000 }
        errorMsg: { type: string, nullable: true }
    EmptyEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            body: { type: object, nullable: true }
    MemberEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            body: { $ref: '#/components/schemas/Member' }
    MemberResourcesEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            body: { $ref: '#/components/schemas/MemberResources' }
    PermissionResourceEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            body: { $ref: '#/components/schemas/PermissionResource' }
    ResourceListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            body: { $ref: '#/components/schemas/ResourceList' }
    RoleEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            body: { $ref: '#/components/schemas/Role' }
    RoleListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            body: { $ref: '#/components/schemas/RoleList' }
    RoleResourcesEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            body: { $ref: '#/components/schemas/RoleResources' }
    RoleMembersEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            body: { $ref: '#/components/schemas/RoleMembers' }
    MemberListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            body: { $ref: '#/components/schemas/MemberList' }
    PermissionResource:
      type: object
      required: [resourceKey, name, origin, type]
      properties:
        resourceKey: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        origin: { type: string, enum: [system, business] }
        type: { type: string, enum: [system, page, operation] }
        targetResourceRef: { type: string, nullable: true }
    Role:
      type: object
      required: [roleId, name, enable, system]
      properties:
        roleId: { type: string, pattern: '^(ROLE[0-9]{3}|SYSTEM_ADMIN)$' }
        name: { type: string }
        description: { type: string, nullable: true }
        enable: { type: boolean }
        system: { type: boolean, readOnly: true }
    Member:
      type: object
      required: [memberId, memberName]
      properties:
        memberId: { type: string }
        memberName: { type: string }
    MockLoginRequest:
      type: object
      required: [memberId]
      properties:
        memberId: { type: string, minLength: 1, maxLength: 32, example: member-001 }
    MemberResources:
      type: object
      required: [memberId, resourceKeys]
      properties:
        memberId: { type: string }
        resourceKeys: { type: array, uniqueItems: true, items: { type: string } }
    RoleUpsertRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        description: { type: string, nullable: true, maxLength: 128 }
    RoleStatusRequest:
      type: object
      required: [enable]
      properties:
        enable: { type: boolean }
    RoleResources:
      type: object
      required: [roleId, resourceKeys]
      properties:
        roleId: { type: string }
        resourceKeys: { type: array, uniqueItems: true, items: { type: string } }
    RoleMembers:
      type: object
      required: [roleId, members]
      properties:
        roleId: { type: string }
        members: { type: array, items: { $ref: '#/components/schemas/Member' } }
    ResourceList:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [list]
          properties: { list: { type: array, items: { $ref: '#/components/schemas/PermissionResource' } } }
    RoleList:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [list]
          properties: { list: { type: array, items: { $ref: '#/components/schemas/Role' } } }
    MemberList:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          required: [list]
          properties: { list: { type: array, items: { $ref: '#/components/schemas/Member' } } }
    PageBase:
      type: object
      required: [total, list, current, pageSize, totalPage]
      properties:
        total: { type: integer, format: int64 }
        list: { type: array, items: {} }
        current: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        totalPage: { type: integer, format: int64 }

