openapi: 3.0.3
info:
  title: XCodeAgent Authorization Management API
  version: authorization-api.v1
  description: 运行态权限管理的前后端共享契约；仅由 auth 模板分支实现。
servers:
  - url: /
security:
  - cookieAuth: []
paths:
  /api/authorization/status:
    get:
      operationId: getAuthorizationStatus
      summary: 获取权限运行时就绪状态
      security: []
      responses:
        '200': { description: 状态, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorizationStatus' } } } }
  /api/authorization/me/effective-permissions:
    get:
      operationId: getMyEffectivePermissions
      summary: 获取当前认证成员的有效资源
      responses:
        '200': { description: 有效权限, content: { application/json: { schema: { $ref: '#/components/schemas/EffectivePermissions' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/resources:
    get:
      operationId: listAuthorizationResources
      summary: 查询只读资源目录
      responses:
        '200': { description: 资源列表, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/resources/{resourceKey}:
    get:
      operationId: getAuthorizationResource
      summary: 查询单个只读资源
      parameters: [{ $ref: '#/components/parameters/ResourceKey' }]
      responses:
        '200': { description: 资源, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionResource' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/roles:
    get:
      operationId: listAuthorizationRoles
      summary: 分页查询角色
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/IncludeDeleted' }]
      responses:
        '200': { description: 角色列表, content: { application/json: { schema: { $ref: '#/components/schemas/RoleList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/NotReady' }
    post:
      operationId: createAuthorizationRole
      summary: 创建普通角色
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleUpsertRequest' } } } }
      responses:
        '201': { description: 已创建角色, content: { application/json: { schema: { $ref: '#/components/schemas/RoleWriteResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/roles/{roleId}:
    get:
      operationId: getAuthorizationRole
      summary: 查询角色详情
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      responses:
        '200': { description: 角色, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/NotReady' }
    put:
      operationId: updateAuthorizationRole
      summary: 修改角色名称或说明
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleUpsertRequest' } } } }
      responses:
        '200': { description: 已更新角色, content: { application/json: { schema: { $ref: '#/components/schemas/RoleWriteResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '503': { $ref: '#/components/responses/NotReady' }
    delete:
      operationId: deleteAuthorizationRole
      summary: 逻辑删除普通角色
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionRequest' } } } }
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/roles/{roleId}/status:
    put:
      operationId: setAuthorizationRoleStatus
      summary: 启用或停用角色
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleStatusRequest' } } } }
      responses:
        '200': { description: 已更新状态, content: { application/json: { schema: { $ref: '#/components/schemas/RoleWriteResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/roles/{roleId}/resources:
    get:
      operationId: getAuthorizationRoleResources
      summary: 查询角色资源关系
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      responses:
        '200': { description: 角色资源, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResources' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/NotReady' }
    put:
      operationId: replaceAuthorizationRoleResources
      summary: 全量替换角色资源关系
      parameters: [{ $ref: '#/components/parameters/RoleId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResourcesRequest' } } } }
      responses:
        '200': { description: 已替换资源关系, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResources' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/members:
    get:
      operationId: listAuthorizationMembers
      summary: 分页查询本地授权成员
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: 成员列表, content: { application/json: { schema: { $ref: '#/components/schemas/MemberList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/members/{subjectId}:
    get:
      operationId: getAuthorizationMember
      summary: 查询本地授权成员
      parameters: [{ $ref: '#/components/parameters/SubjectId' }]
      responses:
        '200': { description: 成员, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/NotReady' }
    delete:
      operationId: deleteAuthorizationMember
      summary: 删除本地授权记录
      parameters: [{ $ref: '#/components/parameters/SubjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionRequest' } } } }
      responses:
        '200': { description: 已删除本地授权记录, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/members/{subjectId}/roles:
    put:
      operationId: replaceAuthorizationMemberRoles
      summary: 全量替换成员角色关系
      parameters: [{ $ref: '#/components/parameters/SubjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MemberRolesRequest' } } } }
      responses:
        '200': { description: 已替换成员角色, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/members/{subjectId}/effective-permissions:
    get:
      operationId: getAuthorizationMemberEffectivePermissions
      summary: 查询成员有效资源
      parameters: [{ $ref: '#/components/parameters/SubjectId' }]
      responses:
        '200': { description: 有效权限, content: { application/json: { schema: { $ref: '#/components/schemas/EffectivePermissions' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/NotReady' }
  /api/authorization/audit:
    get:
      operationId: listAuthorizationAudit
      summary: 分页查询授权审计
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: 审计列表, content: { application/json: { schema: { $ref: '#/components/schemas/AuditList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/NotReady' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: JSESSIONID }
  parameters:
    ResourceKey: { name: resourceKey, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_]*$' } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
    SubjectId: { name: subjectId, in: path, required: true, schema: { type: string, minLength: 1 } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    IncludeDeleted: { name: includeDeleted, in: query, required: false, schema: { type: boolean, default: false } }
  responses:
    Unauthenticated: { description: 未认证, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: 无系统管理资源, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: 资源不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotReady: { description: 权限运行时未就绪, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    RevisionConflict: { description: 授权版本冲突或防锁死拒绝, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    AuthorizationStatus:
      type: object
      required: [ready, contractVersion, reason]
      properties:
        ready: { type: boolean }
        contractVersion: { type: string, enum: [authorization-api.v1] }
        reason: { type: string, nullable: true, enum: [runtime_not_built, database_not_initialized, resource_manifest_mismatch] }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [unauthenticated, forbidden, authorization_not_ready, authorization_revision_conflict, last_administrator_required, not_found] }
        message: { type: string }
        currentRevision: { type: integer, format: int64 }
        details: { type: object, additionalProperties: true }
    PermissionResource:
      type: object
      required: [resourceKey, origin, type, name, description, semanticDefinition]
      properties:
        resourceKey: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        origin: { type: string, enum: [system, business] }
        type: { type: string, enum: [system, page, operation, data] }
        name: { type: string }
        description: { type: string }
        semanticDefinition: { type: string }
        targetResourceRef: { type: string }
        policyKey: { type: string }
    ResourceList:
      type: object
      required: [items, total, page, pageSize, revision]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PermissionResource' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        revision: { type: integer, format: int64 }
    Role:
      type: object
      required: [roleId, name, active, deleted, isSystemRole, isInitialAdminRole, resourceKeys]
      properties:
        roleId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        active: { type: boolean }
        deleted: { type: boolean }
        isSystemRole: { type: boolean, readOnly: true }
        isInitialAdminRole: { type: boolean, readOnly: true }
        resourceKeys: { type: array, items: { type: string } }
    RoleList:
      type: object
      required: [items, total, page, pageSize, revision]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Role' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        revision: { type: integer, format: int64 }
    RoleUpsertRequest:
      type: object
      required: [name, expectedRevision]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 500 }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
    RoleStatusRequest:
      type: object
      required: [active, expectedRevision]
      properties:
        active: { type: boolean }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
    RoleResourcesRequest:
      type: object
      required: [resourceKeys, expectedRevision]
      properties:
        resourceKeys: { type: array, uniqueItems: true, items: { type: string } }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
    RoleResources:
      type: object
      required: [roleId, resourceKeys, revision]
      properties:
        roleId: { type: string, format: uuid }
        resourceKeys: { type: array, uniqueItems: true, items: { type: string } }
        revision: { type: integer, format: int64 }
    RoleWriteResult:
      type: object
      required: [role, revision]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        revision: { type: integer, format: int64 }
    Member:
      type: object
      required: [subjectId, source, roleIds]
      properties:
        subjectId: { type: string }
        displayName: { type: string, nullable: true }
        source: { type: string, enum: [seed, preconfigured, jit] }
        roleIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
    MemberList:
      type: object
      required: [items, total, page, pageSize, revision]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Member' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        revision: { type: integer, format: int64 }
    MemberRolesRequest:
      type: object
      required: [roleIds, expectedRevision]
      properties:
        roleIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        displayName: { type: string, nullable: true, maxLength: 100 }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
    EffectivePermissions:
      type: object
      required: [subjectId, resourceKeys, revision]
      properties:
        subjectId: { type: string }
        resourceKeys: { type: array, uniqueItems: true, items: { type: string } }
        revision: { type: integer, format: int64 }
    RevisionRequest:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 0 }
    RevisionResult:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64 }
    AuditEntry:
      type: object
      required: [id, actorSubjectId, action, target, revision, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorSubjectId: { type: string }
        action: { type: string }
        target: { type: string }
        before: { type: object, nullable: true, additionalProperties: true }
        after: { type: object, nullable: true, additionalProperties: true }
        revision: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
    AuditList:
      type: object
      required: [items, total, page, pageSize, revision]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        revision: { type: integer, format: int64 }
