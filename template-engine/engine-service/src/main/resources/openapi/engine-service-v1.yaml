openapi: 3.0.3
info:
  title: DevAgentStudio Template Engine Service
  version: v3
paths:
  /v1/app-updates/check:
    post:
      operationId: checkAppUpdate
      description: Checks desktop app SemVer precedence. Stable clients are never offered prerelease versions. The CDN base URL is returned unchanged; the client constructs the installer path.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppUpdateRequest' } } } }
      responses:
        '200': { description: App update eligibility, content: { application/json: { schema: { $ref: '#/components/schemas/AppUpdateResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/generate:
    post:
      operationId: generate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenerateRequest' } } } }
      responses:
        '200': { description: "Complete project package containing frontend and exactly one of backend or agent-runtime, V3 TemplateState and the three Route Projector contract JSON files at .devagentstudio/template-contracts/", content: { application/zip: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/update:
    post:
      operationId: update
      requestBody: { required: true, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/UpdateRequest' }, { $ref: '#/components/schemas/UpdateRequestV4' }] } } } }
      responses:
        '200': { description: Update package, content: { application/zip: { schema: { type: string, format: binary } } } }
        '204': { description: No template change }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error: { description: Error envelope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    SemanticVersion:
      type: string
      description: Strict SemVer 2.0.0. Build metadata is ignored for precedence.
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
    AppUpdateRequest:
      type: object
      required: [currentVersion]
      additionalProperties: false
      properties:
        currentVersion: { $ref: '#/components/schemas/SemanticVersion' }
    AppUpdateResponse:
      type: object
      required: [updateAvailable, latestAppVersion, appDownloadUrl]
      additionalProperties: false
      properties:
        updateAvailable: { type: boolean }
        latestAppVersion: { $ref: '#/components/schemas/SemanticVersion' }
        appDownloadUrl:
          type: string
          format: uri
          nullable: true
          description: Unchanged configured HTTP(S) CDN base URL when updateAvailable is true; null otherwise. The desktop updater reads latest.yml or latest-mac.yml from this base URL.
    GenerateRequest:
      type: object
      required: [requestedConfig]
      additionalProperties: false
      properties: { requestedConfig: { $ref: '#/components/schemas/RequestedConfig' } }
    UpdateRequest:
      type: object
      required: [protocolVersion, currentTemplateState, requestedConfig, mode]
      additionalProperties: false
      properties:
        protocolVersion: { type: string, enum: ['3'] }
        currentTemplateState: { $ref: '#/components/schemas/TemplateState' }
        requestedConfig: { $ref: '#/components/schemas/RequestedConfig' }
        mode: { type: string, enum: [APPLY, RECONCILE] }
    UpdateRequestV4:
      type: object
      required: [protocolVersion, currentTemplateState, requestedConfig, mode]
      additionalProperties: false
      properties:
        protocolVersion: { type: string, enum: ['4'] }
        currentTemplateState: { $ref: '#/components/schemas/TemplateState' }
        requestedConfig: { $ref: '#/components/schemas/UpdateRequestedConfigV4' }
        mode: { type: string, enum: [APPLY, RECONCILE] }
    RequestedConfig:
      type: object
      required: [capabilities]
      additionalProperties: false
      properties:
        capabilities:
          type: object
          additionalProperties: { $ref: '#/components/schemas/CapabilityRequest' }
        applicationConfig:
          $ref: '#/components/schemas/ApplicationConfig'
    UpdateRequestedConfigV4:
      type: object
      required: [capabilities]
      additionalProperties: false
      properties:
        capabilities:
          type: object
          additionalProperties: { $ref: '#/components/schemas/CapabilityRequest' }
    ApplicationConfig:
      type: object
      required: [appName, appIcon, theme]
      additionalProperties: false
      properties:
        appName: { type: string, minLength: 1, maxLength: 128 }
        appIcon: { type: string, minLength: 1, maxLength: 128 }
        theme: { type: object, required: [primaryColor], additionalProperties: false, properties: { primaryColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } } }
        auth:
          type: object
          nullable: true
          required: [enable, authnSource, yht]
          additionalProperties: false
          properties:
            enable: { type: boolean }
            authnSource: { type: string, minLength: 1, maxLength: 32 }
            yht:
              type: object
              required: [clientId, privateKey, publicKey, centerPublicKey]
              additionalProperties: false
              properties:
                clientId: { type: string, minLength: 1, maxLength: 256 }
                privateKey: { type: string, minLength: 1, maxLength: 16384 }
                publicKey: { type: string, minLength: 1, maxLength: 16384 }
                centerPublicKey: { type: string, minLength: 1, maxLength: 16384 }
    CapabilityRequest:
      type: object
      required: [enabled, config]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true }
    CapabilityState:
      type: object
      required: [enabled, config]
      additionalProperties: false
      properties:
        enabled: { type: boolean, enum: [true] }
        config: { type: object, additionalProperties: true }
    InstalledArtifactState:
      type: object
      required: [capabilityId, target, installedRevision]
      additionalProperties: false
      properties:
        capabilityId: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$' }
        target: { type: string, minLength: 1 }
        installedRevision: { type: string, pattern: '^\\d{4}\\.\\d{2}\\.\\d{2}\\.[1-9]\\d*$' }
    JavaAnnotationSpec:
      type: object
      required: [annotationClass]
      additionalProperties: false
      properties:
        annotationClass: { type: string, pattern: '^[A-Za-z_$][A-Za-z0-9_$]*(\\.[A-Za-z_$][A-Za-z0-9_$]*)+$' }
    MavenDependencySpec:
      type: object
      required: [groupId, artifactId, version, scope]
      additionalProperties: false
      properties:
        groupId: { type: string, pattern: '^[A-Za-z0-9_.-]+$' }
        artifactId: { type: string, pattern: '^[A-Za-z0-9_.-]+$' }
        version: { type: string, nullable: true }
        scope: { type: string, nullable: true, enum: [compile, provided, runtime, test, system, null] }
    JavaAnnotationContributionState:
      type: object
      required: [type, target, owners, spec, appliedRevision]
      additionalProperties: false
      properties:
        type: { type: string, enum: [JAVA_ANNOTATION] }
        target: { type: string, enum: ['backend/src/main/java/com/cmbchina/backend/Application.java'] }
        owners: { type: array, minItems: 1, uniqueItems: true, items: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$' } }
        spec: { $ref: '#/components/schemas/JavaAnnotationSpec' }
        appliedRevision: { type: string, pattern: '^\\d{4}\\.\\d{2}\\.\\d{2}\\.[1-9]\\d*$' }
    MavenContributionState:
      type: object
      required: [type, target, owners, spec, appliedRevision]
      additionalProperties: false
      properties:
        type: { type: string, enum: [MAVEN_DEPENDENCY] }
        target: { type: string, enum: ['backend/pom.xml'] }
        owners: { type: array, minItems: 1, uniqueItems: true, items: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$' } }
        spec: { $ref: '#/components/schemas/MavenDependencySpec' }
        appliedRevision: { type: string, pattern: '^\\d{4}\\.\\d{2}\\.\\d{2}\\.[1-9]\\d*$' }
    ManagedContributionState:
      oneOf:
        - { $ref: '#/components/schemas/JavaAnnotationContributionState' }
        - { $ref: '#/components/schemas/MavenContributionState' }
    TemplateState:
      type: object
      required: [schemaVersion, templateRevision, requested, effective, installedArtifacts, managedContributions]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, enum: [3] }
        templateRevision: { type: string, pattern: '^\\d{4}\\.\\d{2}\\.\\d{2}\\.[1-9]\\d*$' }
        requested: { type: object, additionalProperties: { $ref: '#/components/schemas/CapabilityState' } }
        effective: { type: object, additionalProperties: { $ref: '#/components/schemas/CapabilityState' } }
        installedArtifacts: { type: object, additionalProperties: { $ref: '#/components/schemas/InstalledArtifactState' } }
        managedContributions: { type: object, additionalProperties: { $ref: '#/components/schemas/ManagedContributionState' } }
        managedConfiguration: { type: object, additionalProperties: true }
        stateSequence: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [code, message, details, traceId]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, APP_UPDATE_UNAVAILABLE, PROTOCOL_VERSION_UNSUPPORTED, TEMPLATE_STATE_SCHEMA_UNSUPPORTED, TEMPLATE_STATE_INVALID, CAPABILITY_UNKNOWN, CAPABILITY_REMOVAL_UNSUPPORTED, CAPABILITY_UPGRADE_UNSUPPORTED, RECONCILE_STATE_CHANGE_REQUIRED, TEMPLATE_RELEASE_DOWNGRADE_UNSUPPORTED, TEMPLATE_SOURCE_INVALID, EXTENSION_CONTRACT_MISMATCH, MAVEN_DEPENDENCY_CONFLICT, PACKAGE_BUILD_FAILED, CONFIG_TARGET_CONFLICT]
        message: { type: string }
        details: { type: object }
        traceId: { type: string }
