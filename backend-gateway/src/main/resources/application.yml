server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: generated-application-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 300s
      routes:
        - id: backend-health
          uri: ${BUSINESS_BACKEND_BASE_URL:http://127.0.0.1:8081}
          metadata:
            xcode.route-kind: infrastructure
          predicates:
            - Path=/health
            - Method=GET
          filters:
            - SetPath=/actuator/health

gateway:
  security:
    mode: ${GATEWAY_AUTH_MODE:enterprise}
    application-id: ${XCODE_APPLICATION_ID:generated-application}
    issuer: ${XCODE_USER_INFO_ISSUER:xcode-generated-gateway}
    audience: ${XCODE_USER_INFO_AUDIENCE:application-internal-services}
    internal-identity-secret: ${XCODE_USER_INFO_SECRET}
    service-token: ${XCODE_GATEWAY_SERVICE_TOKEN}
    internal-identity-ttl-seconds: 60
    mock-token-ttl-seconds: 21600
    public-paths:
      - /health
      - /actuator/health/**
  agent:
    enabled: ${GATEWAY_AGENT_ENABLED:false}
    policy-mode: ${GATEWAY_AGENT_POLICY_MODE:remote}
    policy-base-url: ${AGENT_POLICY_BASE_URL:}
    policy-path: ${AGENT_POLICY_PATH:/internal/gateway/agent-policy}
    policy-timeout-millis: ${AGENT_POLICY_TIMEOUT_MILLIS:2000}
    fail-closed: true
  cors:
    allowed-origins: []

management:
  server:
    port: ${GATEWAY_MANAGEMENT_PORT:9080}
    address: ${GATEWAY_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
